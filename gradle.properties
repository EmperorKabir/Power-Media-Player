# Project-wide Gradle settings

# JVM — increase heap for large Kotlin/Hilt/Room KSP compile graph
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallelism & caching — dramatically reduces incremental build times
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# AndroidX
android.useAndroidX=true

# Non-transitive R classes — faster incremental resource compilation
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# AGP 9 built-in Kotlin compatibility with KSP
android.disallowKotlinSourceSets=false
