<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Media Player - Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="oled-black">
    <div id="app-container">
        <!-- Status Bar Mimic -->
        <div class="status-bar">
            <span class="time">12:00</span>
            <div class="status-icons">
                <span class="material-symbols-rounded">signal_cellular_4_bar</span>
                <span class="material-symbols-rounded">wifi</span>
                <span class="material-symbols-rounded">battery_full</span>
            </div>
        </div>

        <!-- Main Content Area -->
        <main id="screen-content">
            <!-- Player Screen (Default) -->
            <section id="player-screen" class="screen active">
                <div class="artwork-container">
                    <div class="artwork-glow"></div>
                    <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&q=80&w=600" alt="Album Art" id="main-artwork">
                </div>

                <div class="player-info">
                    <h1 id="track-title">Cybernetic Pulse</h1>
                    <p id="track-artist">Neon Architect • Future Soundscapes</p>
                </div>

                <div class="progress-section">
                    <div class="slider-container">
                        <div class="time-labels">
                            <span id="current-time">0:42</span>
                            <span id="duration">3:54</span>
                        </div>
                        <input type="range" min="0" max="100" value="25" class="slider" id="track-progress">
                    </div>
                </div>

                <!-- 13-Button Transport Row -->
                <div class="transport-container">
                    <div class="transport-row">
                        <button class="transport-btn secondary"><span class="material-symbols-rounded">shuffle</span></button>
                        <button class="transport-btn secondary"><span class="material-symbols-rounded">history_5</span></button>
                        <button class="transport-btn secondary"><span class="material-symbols-rounded">skip_previous</span></button>
                        <button class="transport-btn primary" id="play-pause-btn"><span class="material-symbols-rounded">play_arrow</span></button>
                        <button class="transport-btn secondary"><span class="material-symbols-rounded">skip_next</span></button>
                        <button class="transport-btn secondary"><span class="material-symbols-rounded">forward_10</span></button>
                        <button class="transport-btn secondary"><span class="material-symbols-rounded">repeat</span></button>
                    </div>
                </div>

                <div class="secondary-controls">
                    <div class="control-row">
                        <span class="material-symbols-rounded">speed</span>
                        <input type="range" class="control-slider" value="1.0" min="0.5" max="2.0" step="0.1">
                        <span class="speed-label">1.0x</span>
                    </div>
                </div>
            </section>

            <!-- Library Screen -->
            <section id="library-screen" class="screen">
                <header class="screen-header">
                    <h2>Library</h2>
                    <div class="header-actions">
                        <span class="material-symbols-rounded">file_open</span>
                        <span class="material-symbols-rounded">refresh</span>
                    </div>
                </header>
                <div class="tabs">
                    <button class="tab active">Audio</button>
                    <button class="tab">Video</button>
                </div>
                <div class="media-list">
                    <!-- Mock items will legacy be injected here -->
                </div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-screen="player">
                <span class="material-symbols-rounded">play_circle</span>
                <span>Player</span>
            </button>
            <button class="nav-item" data-screen="library">
                <span class="material-symbols-rounded">library_music</span>
                <span>Library</span>
            </button>
            <button class="nav-item" data-screen="equalizer">
                <span class="material-symbols-rounded">equalizer</span>
                <span>EQ</span>
            </button>
            <button class="nav-item" data-screen="settings">
                <span class="material-symbols-rounded">settings</span>
                <span>Settings</span>
            </button>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
