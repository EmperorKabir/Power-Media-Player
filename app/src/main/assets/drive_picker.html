<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pick a Drive folder</title>
  <style>
    html,body {
      margin:0;padding:0;height:100%;background:#000;color:#eee;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }
    .status { padding:24px;text-align:center;color:#aaa; }
  </style>
</head>
<body>
  <div id="status" class="status">Loading Drive Picker…</div>
  <script src="https://apis.google.com/js/api.js"></script>
  <script>
    (function () {
      // Values injected by DrivePickerActivity before the page loads.
      var oauthToken = window.__OAUTH_TOKEN__ || "";
      var apiKey     = window.__API_KEY__     || "";
      var appId      = window.__APP_ID__      || "";

      function fail(msg) {
        document.getElementById("status").textContent = msg;
        if (window.PMP_PICKER) window.PMP_PICKER.onError(msg);
      }

      if (!oauthToken) return fail("No OAuth token — please sign in again.");
      if (!apiKey || !appId) {
        return fail(
          "Drive Picker not configured. Add DRIVE_PICKER_API_KEY and " +
          "DRIVE_PICKER_APP_ID to local.properties and rebuild."
        );
      }

      function onPicked(data) {
        var action = data[google.picker.Response.ACTION];
        if (action === google.picker.Action.PICKED) {
          var docs = data[google.picker.Response.DOCUMENTS] || [];
          var first = docs[0];
          if (first && window.PMP_PICKER) {
            var id = first[google.picker.Document.ID];
            var name = first[google.picker.Document.NAME];
            window.PMP_PICKER.onPicked(id, name || "Picked folder");
          }
        } else if (action === google.picker.Action.CANCEL) {
          if (window.PMP_PICKER) window.PMP_PICKER.onCancel();
        }
      }

      function buildPicker() {
        try {
          // DocsView with includeFolders=true and setSelectFolderEnabled
          // means the user selects a folder, not a file. Folders return
          // their canonical Drive folder ID, which our app uses as the
          // root of all subsequent REST queries.
          var view = new google.picker.DocsView()
            .setIncludeFolders(true)
            .setSelectFolderEnabled(true)
            .setMimeTypes("application/vnd.google-apps.folder");
          var picker = new google.picker.PickerBuilder()
            .addView(view)
            .setOAuthToken(oauthToken)
            .setDeveloperKey(apiKey)
            .setAppId(appId)
            .setCallback(onPicked)
            .enableFeature(google.picker.Feature.NAV_HIDDEN)
            .build();
          picker.setVisible(true);
          document.getElementById("status").style.display = "none";
        } catch (e) {
          fail("Picker init failed: " + (e && e.message ? e.message : e));
        }
      }

      gapi.load("picker", { callback: buildPicker });
    })();
  </script>
</body>
</html>
